[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "asyncpg>=0.29,<1",
  "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pypdf>=5,<6",
  "openai>=1.58,<3", "boto3>=1.35,<2", "python-multipart>=0.0.12,<1", "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: opt-in tests that call official SEC/TWSE services"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["fixtures*", "tests*"]
